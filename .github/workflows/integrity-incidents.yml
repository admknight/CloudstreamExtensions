name: Track published integrity incidents

on:
  workflow_run:
    workflows: ["Audit Published Plugin Integrity"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed master-branch integrity audit workflow run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: integrity-incident-tracking
  cancel-in-progress: false

jobs:
  incidents:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted incident scripts
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Verify source workflow and origin
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in *[!0-9]*|'') echo "Invalid run ID"; exit 1;; esac
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > source-run.json
          python3 tools/validate_audit_origin.py \
            --run-json source-run.json \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$RUN_ID"

      - name: Download exactly matching audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "plugin-integrity-audit-$RUN_ID" --dir evidence
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          items=list(Path('evidence').rglob('audit-report.json'))
          if len(items)!=1:
              raise SystemExit('Exactly one audit JSON artifact required')
          shutil.copyfile(items[0], 'audit-report.json')
          PY

      - name: Upsert evidence-backed incidents; never edit catalogs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sync_integrity_issues.py --audit audit-report.json

      - name: Retain incident processing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-incident-processing-${{ github.run_id }}
          path: |
            source-run.json
            audit-report.json
          retention-days: 14
          if-no-files-found: warn
