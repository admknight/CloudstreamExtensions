name: Verify Visitor Journeys (PR)
on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/explore.html'
      - 'README.md'
      - 'tools/merge_upstreams.py'
      - '.github/workflows/pr-visitor-journeys-verification.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate HTML paths and regenerating README
        run: |
          python3 -m py_compile tools/merge_upstreams.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          m = Path('docs/index.html').read_text()
          e = Path('docs/explore.html').read_text()
          r = Path('README.md').read_text()
          assert m.count('class="route-card') == 3, "Need exactly three homepage choices"
          assert 'id="install-full"' in m, "Full shortcode link target missing"
          assert 'id="share-project"' in m, "Share function removed"
          assert m.count('id="shortcode"') == 1 and m.count('id="manifest"') == 1
          assert 'href="explore.html"' in m
          assert 'adam-cloudstream-bundles.badass-insane.workers.dev' in m
          assert e.count('class="install-path"') == 2, "Explorer install pathways missing"
          assert 'bookmarks' in e.lower() and 'automatically transfer' in e
          assert 'Three ways to use MegaRepo' in r
          assert 'Guarded production aggregation runs every three hours' in r
          spec=importlib.util.spec_from_file_location('mega','tools/merge_upstreams.py')
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          report={'generatedAt':'2026-10-09 UTC','uniquePlugins':1,
                  'sourceHealth':{'ok':1,'failed':0},'sourceStatus':[],
                  'packageHealth':{'reachable':1,'failed':0},'categoryCounts':{},
                  'failedPlugins':[],'duplicates':[],
                  'changes':{'added':0,'updated':0,'removed':0}}
          generated=mod.build_readme(report,[])
          for phrase in ['Three ways to use MegaRepo',
                         'Personal Repository Builder', 'Extension Explorer',
                         'Full MegaRepo installation',
                         'Guarded production aggregation runs every three hours',
                         'read-only package integrity audit']:
              assert phrase in generated, "Generated README missing: " + phrase
          print("PASS: Website choices, links, shortcode, current README and generated README")
          PY
