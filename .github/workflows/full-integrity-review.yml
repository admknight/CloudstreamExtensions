name: Full Catalog Integrity Review (Read Only)

on:
  schedule:
    - cron: '11 2 * * *'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/full-integrity-review.yml'
      - 'tools/verify_candidate_integrity.py'
      - 'tools/plan_per_plugin_selection.py'
      - 'tools/reconcile_integrity_review.py'
      - 'tools/verified_immutable_fallback.py'
      - 'tools/index_immutable_recovery.py'
      - 'tools/check_local_recovery_readiness.py'
      - 'tests/test_check_local_recovery_readiness.py'
      - 'trusted_binary_approvals.json'
  pull_request:
    paths:
      - 'tools/plan_per_plugin_selection.py'
      - 'tools/reconcile_integrity_review.py'
      - 'tests/test_reconcile_integrity_review.py'
      - 'tests/test_per_plugin_selection.py'
      - 'docs/PER_PLUGIN_INTEGRITY_PREVIEW.md'
      - '.github/workflows/full-integrity-review.yml'
      - 'tools/verify_candidate_integrity.py'
      - 'tests/test_verify_candidate_integrity.py'
      - 'tests/test_immutable_fallback_selection.py'
      - 'tools/check_local_recovery_readiness.py'
      - 'tests/test_check_local_recovery_readiness.py'
      - 'trusted_binary_approvals.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readonly-integrity-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Per-plugin selection regressions
        run: |
          python3 -m unittest discover -s tests -p test_verify_candidate_integrity.py -v
          python3 -m unittest discover -s tests -p test_per_plugin_selection.py -v
          python3 -m unittest discover -s tests -p test_reconcile_integrity_review.py -v
          python3 -m unittest discover -s tests -p test_immutable_fallback_selection.py -v
          python3 -m unittest discover -s tests -p test_check_local_recovery_readiness.py -v
          python3 -m py_compile tools/verify_candidate_integrity.py tools/plan_per_plugin_selection.py tools/reconcile_integrity_review.py tools/verified_immutable_fallback.py tools/check_local_recovery_readiness.py
      - name: Parse workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |p| YAML.load_file(p) }; puts "Workflow YAML parsed."'
      - name: Verify this workflow cannot publish catalogs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('.github/workflows/full-integrity-review.yml').read_text()
          assert 'contents: read' in code
          assert ('contents:' + ' write') not in code
          assert ('gh ' + 'workflow run') not in code
          assert ('git' + ' push') not in code
          print('Only read-only catalog preview permissions are requested.')
          PY

  full-catalog-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Checkout one published catalog snapshot
        uses: actions/checkout@v4
        with:
          ref: builds
          path: production
          persist-credentials: false
      - name: Build all-source candidate without publication
        run: |
          set -euo pipefail
          python3 source/tools/merge_upstreams.py candidate \
            --previous production/plugins.json \
            --previous-report production/merge-report.json \
            --previous-provenance production/provenance.json
      - name: Verify published checksums against immutable source revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 source/tools/index_immutable_recovery.py \
            --published production/plugins.json \
            --provenance production/provenance.json \
            --output pinned-recovery-evidence.json \
            --max-history 16 \
            --workers 6
      - name: Download, verify and select individual plugin previews
        run: |
          set -euo pipefail
          python3 source/tools/plan_per_plugin_selection.py \
            --candidate candidate/plugins.json \
            --previous production/plugins.json \
            --candidate-provenance candidate/provenance.json \
            --previous-provenance production/provenance.json \
            --approvals source/trusted_binary_approvals.json \
            --recovery-index pinned-recovery-evidence.json \
            --output-dir review-preview \
            --workers 8
      - name: Record local recovery readiness without approving any binary
        run: |
          set -euo pipefail
          python3 source/tools/check_local_recovery_readiness.py \
            --verification review-preview/verification-report.json \
            --selection review-preview/integrity-selection.json \
            --approvals source/trusted_binary_approvals.json \
            --output review-preview/local-recovery-readiness.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          summary=json.loads(Path('review-preview/local-recovery-readiness.json').read_text())
          selection=json.loads(Path('review-preview/integrity-selection.json').read_text())
          assert summary['mode']=='READ_ONLY_LOCAL_RECOVERY_READINESS'
          assert summary['releaseAuthorized'] is False
          assert summary['blockedCandidateCount']==selection['blockedCandidateCount']
          assert all(item['safeToPublishCandidate'] is False for item in summary['incidents'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('### Local recovery readiness (advisory only)\n\n')
              out.write(f"- Blocked candidate packages: **{summary['blockedCandidateCount']}**\n")
              out.write(f"- Without matching review records: **{summary['withoutMatchingReviewCount']}**\n")
              out.write('- No binary approval, source override, or production publication performed.\n')
          PY
      - name: Rebuild all derived catalog metadata in both preview policies
        run: |
          set -euo pipefail
          python3 source/tools/reconcile_integrity_review.py \
            --candidate-dir candidate \
            --previous-dir production \
            --selection-dir review-preview \
            --output-dir review-compatibility \
            --mode compatibility
          python3 source/tools/reconcile_integrity_review.py \
            --candidate-dir candidate \
            --previous-dir production \
            --selection-dir review-preview \
            --output-dir review-quarantine \
            --mode quarantine
      - name: Cross-check every candidate, decision and preserved provenance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          read=lambda name:json.loads(Path(name).read_text())
          report=read('review-preview/integrity-selection.json')
          plugins=read('review-preview/preview.plugins.json')
          prov=read('review-preview/preview.provenance.json')
          original=read('candidate/plugins.json')
          verification=read('review-preview/verification-report.json')
          old=read('production/plugins.json')
          keys=lambda seq:[str(x.get('internalName') or x.get('name') or '').casefold() for x in seq]
          assert report['mode']=='PREVIEW_ONLY_NO_PUBLICATION'
          assert report['automaticPublicationAuthorized'] is False
          assert report['candidateCount']==len(original)
          assert report['previousCount']==len(old)
          assert report['previewCount']==len(plugins)==len(prov)
          assert verification['checked']==len(original)
          assert len(plugins)>=50
          assert len(set(keys(plugins)))==len(plugins)
          assert set(keys(plugins)) == {str(p['plugin']).casefold() for p in prov}
          c=report['selection']
          assert c['acceptedCandidates']+c['retainedImmutablePrevious']+c['quarantinedExisting']+c['withheldNew']==len(original)
          assert c['acceptedCandidates']+c['retainedImmutablePrevious']==len(plugins)
          assert c['previousRemovedByCandidate']<=len(old)
          assert report['blockedCandidateCount']==verification['blockedCount']
          print('Source/provenance/count reconciliation passed')
          print('Candidate:',report['candidateCount'],'Previous:',report['previousCount'],
                'Preview:',report['previewCount'])
          print('Quarantined existing:',c['quarantinedExisting'],
                'Held new:',c['withheldNew'],
                'Verified previous retained:',c['retainedImmutablePrevious'])
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Per-plugin dry-run (no publication)\n\n')
              f.write(f"- Candidate plugins: **{len(original)}**\n")
              f.write(f"- Proposed plugins: **{len(plugins)}**\n")
              f.write(f"- Existing entries quarantined in preview: **{c['quarantinedExisting']}**\n")
              f.write(f"- New candidates withheld: **{c['withheldNew']}**\n")
              f.write(f"- Verified immutable previous retained: **{c['retainedImmutablePrevious']}**\n")
              f.write('- **Production unchanged; this is not approval to remove plugins.**\n')
          PY
      - name: Reconcile proposed catalog, source, status and release metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text())
          old=load('production/plugins.json')
          preview=load('review-preview/preview.plugins.json')
          selections=load('review-preview/integrity-selection.json')
          for mode in ('compatibility','quarantine'):
              folder=Path('review-'+mode)
              plugins=load(folder/'plugins.json')
              prov=load(folder/'provenance.json')
              report=load(folder/'merge-report.json')
              delta=load(folder/'release-diff.json')
              proof=load(folder/'reconciliation.json')
              assert proof['releaseAuthorized'] is False
              assert report['releaseAuthorized'] is False
              assert report['candidateStatus'].startswith('REVIEW ONLY')
              assert len(plugins)==len(prov)==report['uniquePlugins']==delta['catalog']['plugins']
              assert report['changes']==delta['changes']
              assert report['integrityHealth']==delta['integrityHealth']
              assert sum(report['categoryCounts'].values())==len(plugins)
              assert sum(s['includedCount'] for s in report['sourceStatus'])==len(plugins)
              assert sum(report['changes'].values())==len(set(x['internalName'].casefold() for x in old)|set(x['internalName'].casefold() for x in plugins))
              assert report['inputSnapshotDigests']==selections['inputDigests']
              assert len(plugins)==proof['expectedPluginCount']
              assert "NOT PUBLISHED" in (folder/'STATUS.md').read_text()
              assert "NOT PUBLISHED" in (folder/'README.md').read_text()
              assert proof['changesReconciled'] is True
              if mode=='compatibility':
                  assert len(plugins)>=len(old)
                  assert report['changes']['removed']==0
                  assert report['integrityHealth']['unverifiedPreviousCarried']==selections['selection']['quarantinedExisting']+selections['selection']['previousRemovedByCandidate']
              else:
                  assert len(plugins)==len(preview)
                  assert report['integrityHealth']['unverifiedPreviousCarried']==0
              print(mode,'identities:',len(plugins),'unverified carried:',report['integrityHealth']['unverifiedPreviousCarried'])
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as handle:
              handle.write('\n### Reconciled preview artifacts — NOT PUBLISHED\n\n')
              for mode in ('compatibility','quarantine'):
                  r=load('review-'+mode+'/merge-report.json')
                  handle.write('- '+mode+': '+str(r['uniquePlugins'])+' entries, '+str(r['integrityHealth']['unverifiedPreviousCarried'])+' unverified previous entries preserved in metadata only\n')
              handle.write('\nNo production manifest or binary was modified.\n')
          PY
      - name: Upload read-only verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-integrity-review-${{ github.run_id }}
          path: |
            review-preview/integrity-selection.json
            review-preview/verification-report.json
            review-preview/local-recovery-readiness.json
            review-preview/preview.plugins.json
            review-preview/preview.provenance.json
            candidate/merge-report.json
            pinned-recovery-evidence.json
            review-compatibility/
            review-quarantine/
          if-no-files-found: warn
          retention-days: 14
