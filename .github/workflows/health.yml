name: Check Custom Provider Health

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '*/src/main/kotlin/**'
      - 'tools/custom_provider_health.py'
      - 'tools/source_quality.py'
      - 'tools/legacy_checksum_inventory.py'
      - 'tests/test_custom_provider_health_drift.py'
      - 'tests/test_source_quality.py'
      - 'tests/test_legacy_checksum_inventory.py'
      - '.github/workflows/health.yml'

  pull_request:
    paths:
      - 'tools/custom_provider_health.py'
      - 'tools/source_quality.py'
      - 'tools/legacy_checksum_inventory.py'
      - 'tests/test_custom_provider_health_drift.py'
      - 'tests/test_source_quality.py'
      - 'tests/test_legacy_checksum_inventory.py'
      - '.github/workflows/health.yml'

concurrency:
  group: custom-provider-health
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: builds
          path: baseline-builds
          persist-credentials: false
      - name: Regression-check advisory monitor and source scoring
        run: |
          set -euo pipefail
          python3 -m py_compile tools/custom_provider_health.py tools/source_quality.py tools/legacy_checksum_inventory.py
          python3 -m unittest discover -s tests -p test_custom_provider_health_drift.py -v
          python3 -m unittest discover -s tests -p test_source_quality.py -v
          python3 -m unittest discover -s tests -p test_legacy_checksum_inventory.py -v
      - name: Reconcile actual published sources in a read-only scratch directory
        run: |
          set -euo pipefail
          mkdir -p quality-scratch
          python3 tools/source_quality.py \
            --report baseline-builds/merge-report.json \
            --provenance baseline-builds/provenance.json \
            --history-out quality-scratch/history.json \
            --json quality-scratch/quality.json \
            --markdown quality-scratch/SOURCE_QUALITY.md
          python3 tools/legacy_checksum_inventory.py \
            --plugins baseline-builds/plugins.json \
            --provenance baseline-builds/provenance.json \
            --report baseline-builds/merge-report.json \
            --json quality-scratch/legacy-inventory.json \
            --markdown quality-scratch/LEGACY_CHECKSUM_INVENTORY.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('baseline-builds/merge-report.json').read_text())
          report=json.loads(Path('quality-scratch/quality.json').read_text())
          assert report['sourceCount']==len(source['sourceStatus'])
          assert sum(x['uniqueContributed'] for x in report['sources'])==source['uniquePlugins']
          assert all(0<=x['score']<=100 for x in report['sources'])
          assert report['scoring']['sourceSelectionAffected'] is False
          legacy=json.loads(Path('quality-scratch/legacy-inventory.json').read_text())
          assert legacy['legacyWithoutSha256Count']==source['integrityHealth']['sizeOnlyLegacyCandidateAccepted']
          assert legacy['releaseAuthorized'] is False
          PY

  health:
    needs: tests
    if: github.repository == 'admknight/CloudstreamExtensions' && (github.event_name == 'schedule' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout health history
        uses: actions/checkout@v5
        with:
          ref: health-history
          path: health-history
          fetch-depth: 1

      - name: Checkout one consistent published source catalog
        uses: actions/checkout@v5
        with:
          ref: builds
          path: published-catalog
          persist-credentials: false

      - name: Check provider websites
        run: |
          python3 tools/custom_provider_health.py \
            --root . \
            --json custom-provider-health.json \
            --markdown CUSTOM_PROVIDER_HEALTH.md \
            --history-in health-history/history.json \
            --history-out health-history/history.json \
            --latest-out health-history/latest.json \
            --trends-out health-history/trends.json \
            --max-history 180

      - name: Score published upstream source quality without affecting selection
        run: |
          set -euo pipefail
          python3 tools/source_quality.py \
            --report published-catalog/merge-report.json \
            --provenance published-catalog/provenance.json \
            --history-in health-history/source-quality-history.json \
            --history-out health-history/source-quality-history.json \
            --json health-history/source-quality.json \
            --markdown health-history/SOURCE_QUALITY.md

      - name: Inventory legacy checksum gaps without changing package metadata
        run: |
          set -euo pipefail
          python3 tools/legacy_checksum_inventory.py \
            --plugins published-catalog/plugins.json \
            --provenance published-catalog/provenance.json \
            --report published-catalog/merge-report.json \
            --json health-history/legacy-checksum-inventory.json \
            --markdown health-history/LEGACY_CHECKSUM_INVENTORY.md

      - name: Publish health summary
        if: always()
        run: |
          if [ -f CUSTOM_PROVIDER_HEALTH.md ]; then
            cat CUSTOM_PROVIDER_HEALTH.md
            cat CUSTOM_PROVIDER_HEALTH.md >> "$GITHUB_STEP_SUMMARY"
            if [ -f health-history/SOURCE_QUALITY.md ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              sed -n '1,16p' health-history/SOURCE_QUALITY.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No health report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist health history
        if: always()
        run: |
          set -euo pipefail
          cd health-history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json latest.json trends.json source-quality.json source-quality-history.json SOURCE_QUALITY.md legacy-checksum-inventory.json LEGACY_CHECKSUM_INVENTORY.md
          if git diff --cached --quiet; then
            echo "No health-history changes to publish."
            exit 0
          fi
          git commit -m "health: record provider snapshot"
          for attempt in 1 2 3; do
            if git push origin HEAD:health-history; then
              exit 0
            fi
            echo "Push attempt $attempt failed; refreshing branch."
            git fetch origin health-history
            git rebase origin/health-history
            sleep $((attempt * 2))
          done
          echo "Failed to publish health history after retries."
          exit 1

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-provider-health-${{ github.run_id }}
          path: |
            CUSTOM_PROVIDER_HEALTH.md
            custom-provider-health.json
            health-history/latest.json
            health-history/trends.json
            health-history/source-quality.json
            health-history/source-quality-history.json
            health-history/SOURCE_QUALITY.md
            health-history/legacy-checksum-inventory.json
            health-history/LEGACY_CHECKSUM_INVENTORY.md
          if-no-files-found: warn
