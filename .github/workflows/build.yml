name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: "builds"
          path: "builds"

      - name: Create builds directory if checkout failed
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/builds" ]; then
            mkdir -p $GITHUB_WORKSPACE/builds
            cd $GITHUB_WORKSPACE/builds
            git init
            git checkout -b builds
          fi
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Local Properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > $GITHUB_WORKSPACE/src/local.properties

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          # Run the new aggregator tasks
          ./gradlew clean buildAll generatePluginsJson --stacktrace
          
          echo "Build finished. Harvesting files..."
          # Copy every single built plugin found in any subdirectory
          find . -name "*.cs3" -exec cp -v {} $GITHUB_WORKSPACE/builds/ \;
          # Grab the final aggregate plugins.json from the build directory
          cp -v build/plugins.json $GITHUB_WORKSPACE/builds/ || find . -name "plugins.json" -exec cp -v {} $GITHUB_WORKSPACE/builds/ \;
          # Copy repo.json
          cp -v repo.json $GITHUB_WORKSPACE/builds/ || true

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git status
          git commit -m "Build $GITHUB_SHA" || echo "No changes to commit"
          git push origin builds
