name: Build

on:
  push:
    branches: [ master, main ]
    paths-ignore: [ 'README.md' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: "builds"
          path: "builds"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'gradle'

      - name: Build Plugins
        run: |
          cd src
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          # Use --continue to build as many as possible even if some fail
          ./gradlew clean buildAll generatePluginsJson --continue --stacktrace

      - name: Harvesting Artifacts
        run: |
          mkdir -p builds
          rm -f builds/*.cs3
          find src -name "*.cs3" -exec cp -v {} builds/ \;
          # Combined plugins.json is usually in src/build/
          cp src/build/plugins.json builds/ || find src -name "plugins.json" -exec cp -v {} builds/ \;
          cp src/repo.json builds/ || true

      - name: Push builds
        run: |
          cd builds
          git init || true
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" || true
          git checkout -b builds || git checkout builds
          git add .
          git commit -m "Build $GITHUB_SHA" || echo "No changes"
          git push origin builds
