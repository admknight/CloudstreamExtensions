name: Update Aggregated Repository

concurrency:
  group: production-aggregator
  cancel-in-progress: false

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'sources.json'
      - 'recovery_plugins.json'
      - 'tools/merge_upstreams.py'
      - '.github/workflows/build.yml'
      - 'repo.json'
      - 'trusted_binary_approvals.json'
      - 'tools/verify_candidate_integrity.py'
      - 'tests/test_verify_candidate_integrity.py'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Master
        uses: actions/checkout@v5
        with:
          path: source

      - name: Checkout Builds Branch
        uses: actions/checkout@v5
        with:
          ref: builds
          path: builds

      - name: Build Candidate Catalog
        run: |
          set +e
          python3 source/tools/merge_upstreams.py source/merged \
            --previous builds/plugins.json \
            --previous-report builds/merge-report.json \
            --previous-provenance builds/provenance.json 2>&1 | tee merge-output.txt
          status=${PIPESTATUS[0]}
          echo "MERGE_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Build Status Summary
        if: always()
        run: |
          if [ -f source/merged/STATUS.md ]; then
            cat source/merged/STATUS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No status report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Diagnostic Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggregation-status-${{ github.run_id }}
          path: |
            source/merged/STATUS.md
            source/merged/merge-report.json
            source/merged/provenance.json
            source/merged/RELEASE_NOTES.md
            source/merged/release-diff.json
            merge-output.txt
            package-integrity-gate.json
          if-no-files-found: warn

      - name: Stop On Upstream Failure
        run: |
          if [ "${MERGE_STATUS:-1}" -ne 0 ]; then
            echo "Candidate generation failed. Production remains unchanged."
            exit 1
          fi

      - name: Verify candidate package integrity (fail closed)
        run: |
          python3 -m unittest discover -s source/tests -p 'test_verify_candidate_integrity.py' -v
          python3 source/tools/verify_candidate_integrity.py \
            --candidate source/merged/plugins.json \
            --previous builds/plugins.json \
            --candidate-provenance source/merged/provenance.json \
            --previous-provenance builds/provenance.json \
            --approvals source/trusted_binary_approvals.json \
            --report package-integrity-gate.json

      - name: Safety Gate
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path

          new_plugins = json.loads(Path("source/merged/plugins.json").read_text())
          old_file = Path("builds/plugins.json")
          old_plugins = json.loads(old_file.read_text()) if old_file.exists() else []

          new_count = len(new_plugins)
          old_count = len(old_plugins)
          print(f"Current production count: {old_count}")
          print(f"Candidate production count: {new_count}")

          if new_count < 50:
              raise SystemExit(f"Safety gate: refusing to publish only {new_count} plugins")

          if old_count >= 50:
              minimum_allowed = max(50, int(old_count * 0.80))
              if new_count < minimum_allowed:
                  raise SystemExit(
                      f"Safety gate: candidate dropped from {old_count} to {new_count}; "
                      f"minimum allowed without review is {minimum_allowed}"
                  )

          names = [(p.get("internalName") or p.get("name")) for p in new_plugins]
          if any(not n for n in names):
              raise SystemExit("Safety gate: plugin without name/internalName")
          if len(names) != len(set(names)):
              raise SystemExit("Safety gate: duplicate plugin names remain")

          print("Safety gate passed.")
          PY

      - name: Prepare Builds Branch
        run: |
          cp source/merged/plugins.json builds/plugins.json
          cp source/merged/repo.json builds/repo.json
          cp source/merged/merge-report.json builds/merge-report.json
          cp source/merged/provenance.json builds/provenance.json
          cp source/merged/RELEASE_NOTES.md builds/RELEASE_NOTES.md
          cp source/merged/release-diff.json builds/release-diff.json
          cp source/merged/STATUS.md builds/STATUS.md
          cp source/merged/README.md builds/README.md

          python3 - << 'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("source/merged/merge-report.json").read_text())
          history = Path("builds/BUILD_HISTORY.md")
          header = [
              "# Aggregation Build History",
              "",
              "| UTC | Run | Commit | Plugins | Sources OK | Package failures | Added | Updated | Removed | Result |",
              "| --- | ---: | --- | ---: | ---: | ---: | ---: | ---: | ---: | --- |",
          ]

          old_rows = []
          if history.exists():
              for line in history.read_text().splitlines():
                  if line.startswith("| ") and not line.startswith("| UTC") and not line.startswith("| ---") and line.count("|") >= 11:
                      old_rows.append(line)

          run_id = os.environ.get("GITHUB_RUN_ID", "")
          sha = os.environ.get("GITHUB_SHA", "")[:8]
          row = (
              f"| {report['generatedAt']} | [{run_id}](https://github.com/admknight/CloudstreamExtensions/actions/runs/{run_id}) "
              f"| {sha} | {report['uniquePlugins']} | {report['sourceHealth']['ok']} "
              f"| {report['packageHealth']['failed']} | {report['changes']['added']} "
              f"| {report['changes']['updated']} | {report['changes']['removed']} | Published |"
          )

          rows = [row] + [r for r in old_rows if f"/runs/{run_id}" not in r]
          history.write_text("\n".join(header + rows[:100]) + "\n")
          PY

      - name: Publish Builds Branch
        run: |
          cd builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add plugins.json repo.json merge-report.json provenance.json RELEASE_NOTES.md release-diff.json STATUS.md README.md BUILD_HISTORY.md
          if git diff --cached --quiet; then
            echo "No catalog changes to publish."
          else
            git commit -m "Mega catalog update: ${GITHUB_SHA::8}"
            for attempt in 1 2 3; do
              if git push origin builds; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to push builds branch after 3 attempts."
                exit 1
              fi
              echo "Push failed (attempt $attempt/3); retrying..."
              sleep $((attempt * 10))
            done
          fi

      - name: Refresh Master README
        run: |
          cd source
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git fetch origin master
          git rebase origin/master
          cp merged/README.md README.md
          git add README.md
          if git diff --cached --quiet; then
            echo "Master README already current."
          else
            git commit -m "docs: refresh mega-repo dashboard [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:master; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to push master README after 3 attempts."
                exit 1
              fi
              echo "README push failed (attempt $attempt/3); retrying..."
              sleep $((attempt * 10))
            done
          fi
