name: Update Aggregated Repository

concurrency:
  group: production-aggregator
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'tools/merge_upstreams.py'
      - '.github/workflows/build.yml'
      - 'repo.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Master
        uses: actions/checkout@v5
        with:
          path: source

      - name: Build Aggregated Catalog
        run: |
          cd source
          python3 tools/merge_upstreams.py merged

      - name: Checkout Builds Branch
        uses: actions/checkout@v5
        with:
          ref: builds
          path: builds

      - name: Safety Gate
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path

          new_file = Path("source/merged/plugins.json")
          old_file = Path("builds/plugins.json")
          new_plugins = json.loads(new_file.read_text())
          old_plugins = json.loads(old_file.read_text()) if old_file.exists() else []

          new_count = len(new_plugins)
          old_count = len(old_plugins)
          print(f"Current production count: {old_count}")
          print(f"Candidate production count: {new_count}")

          if new_count < 50:
              raise SystemExit(f"Safety gate: refusing to publish only {new_count} plugins")

          if old_count >= 50:
              minimum_allowed = max(50, int(old_count * 0.80))
              if new_count < minimum_allowed:
                  raise SystemExit(
                      f"Safety gate: candidate dropped from {old_count} to {new_count}; "
                      f"minimum allowed without review is {minimum_allowed}"
                  )

          names = [(p.get("internalName") or p.get("name")) for p in new_plugins]
          if any(not n for n in names):
              raise SystemExit("Safety gate: plugin without name/internalName")
          if len(names) != len(set(names)):
              raise SystemExit("Safety gate: duplicate plugin names remain")

          print("Safety gate passed.")
          PY

      - name: Prepare Builds Branch
        run: |
          cp source/merged/plugins.json builds/plugins.json
          cp source/merged/repo.json builds/repo.json
          cp source/merged/merge-report.json builds/merge-report.json

          python3 - << 'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          report = json.loads(Path("source/merged/merge-report.json").read_text())
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          lines = [
              "# Adam Knight Extensions",
              "",
              "One-stop CloudStream catalog aggregated from maintained upstream plugin indexes.",
              "",
              "## Status",
              "",
              f"- Unique plugins: **{report['uniquePlugins']}**",
              f"- Last update: **{now}**",
              "- Production repository: `https://raw.githubusercontent.com/admknight/CloudstreamExtensions/refs/heads/master/repo.json`",
              "",
              "## Upstream sources",
              "",
          ]
          for source, count in report["sourceDistributionAfterDedup"].items():
              lines.append(f"- {source}: {count}")

          lines += [
              "",
              "The catalog is validated and deduplicated before publication. A safety gate blocks suspicious large drops instead of overwriting a healthy production index.",
              "",
          ]
          Path("builds/README.md").write_text("\n".join(lines))
          PY

      - name: Publish Builds Branch
        run: |
          cd builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add plugins.json repo.json merge-report.json README.md
          if git diff --cached --quiet; then
            echo "No catalog changes to publish."
            exit 0
          fi
          git commit -m "Aggregate upstream catalog: ${GITHUB_SHA::8}"
          git push origin builds
