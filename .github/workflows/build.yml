name: Build

on:
  push:
    branches: [ master, main ]
    paths-ignore: [ 'README.md' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: "builds"
          path: "builds"

      - name: Create builds dir if missing
        run: mkdir -p $GITHUB_WORKSPACE/builds

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'gradle'

      - name: Build Plugins
        run: |
          cd src
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew clean buildAll generatePluginsJson --continue --stacktrace || true

      - name: Harvesting Artifacts
        run: |
          # Clean old artifacts
          rm -f $GITHUB_WORKSPACE/builds/*.cs3
          
          # Find all successfully built plugins in category folders
          find src -name "*.cs3" -exec cp -v {} $GITHUB_WORKSPACE/builds/ \;
          
          # Grab the plugins.json (it's usually in src/build/ or project roots)
          find src -name "plugins.json" -exec cp -v {} $GITHUB_WORKSPACE/builds/ \;
          
          # Copy repository definition
          cp src/repo.json $GITHUB_WORKSPACE/builds/ || true

      - name: Push to Builds Branch
        run: |
          cd $GITHUB_WORKSPACE/builds
          git init || true
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" || true
          git checkout -b builds || git checkout builds
          git add .
          git status
          git commit -m "Build $GITHUB_SHA" || echo "No changes"
          git push origin builds
