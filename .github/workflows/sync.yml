name: Sync Plugins

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from Sources
        run: |
          # Configure Git
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          # Sources to sync from (ordered by priority if versions match)
          SOURCES=(
            "https://github.com/Hexated/CloudStream-Extensions.git"
            "https://github.com/phisher98/cloudstream-extensions-phisher.git"
            "https://github.com/rockhero1234/cinephile.git"
            "https://github.com/SaurabhKaperwan/CSX.git"
            "https://github.com/Sushan64/NetMirror-Extension.git"
            "https://github.com/Stormunblessed/storm-ext.git"
          )

          mkdir -p temp_sources

          for REPO_URL in "${SOURCES[@]}"; do
            # Create a unique name for the temp folder
            REPO_NAME=$(echo "$REPO_URL" | sed -E 's|https://[^/]+/([^/]+)/([^/]+)(\.git)?|\1_\2|' | sed 's|\.git||')
            echo "Cloning $REPO_NAME..."
            git clone --depth 1 "$REPO_URL" "temp_sources/$REPO_NAME"
            
            find "temp_sources/$REPO_NAME" -maxdepth 2 -name "build.gradle.kts" | while read -r GRADLE_FILE; do
              PLUGIN_DIR=$(dirname "$GRADLE_FILE")
              PLUGIN_NAME=$(basename "$PLUGIN_DIR")
              
              if [ "$PLUGIN_DIR" == "temp_sources/$REPO_NAME" ]; then continue; fi
              if [[ "$PLUGIN_NAME" =~ ^(gradle|buildSrc|build|.github|.idea)$ ]]; then continue; fi

              # --- VERSION CHECK ---
              NEW_VERSION=$(grep -E "^version\s*=" "$GRADLE_FILE" | sed -E 's/.*=[[:space:]]*"?([0-9]+)"?.*/\1/')
              OLD_VERSION=$(grep -E "^version\s*=" "$PLUGIN_NAME/build.gradle.kts" 2>/dev/null | sed -E 's/.*=[[:space:]]*"?([0-9]+)"?.*/\1/')
              
              if [ ! -z "$OLD_VERSION" ] && [ ! -z "$NEW_VERSION" ] && [ "$NEW_VERSION" -le "$OLD_VERSION" ]; then
                echo "Skipping $PLUGIN_NAME (v$OLD_VERSION >= v$NEW_VERSION)"
                continue
              fi

              echo "Syncing $PLUGIN_NAME (v${OLD_VERSION:-0} -> v$NEW_VERSION)..."
              
              # CLEAN UP OLD DATA TO PREVENT DUPLICATES
              if [ -d "$PLUGIN_NAME/src" ]; then rm -rf "$PLUGIN_NAME/src"; fi
              mkdir -p "$PLUGIN_NAME"
              cp -r "$PLUGIN_DIR"/* "$PLUGIN_NAME/"
              
              # --- SURGERY & BRANDING ---
              
              # 1. Manifest Surgery (Fixes package errors)
              MANIFEST="$PLUGIN_NAME/src/main/AndroidManifest.xml"
              if [ -f "$MANIFEST" ]; then
                sed -i 's/package="[^"]*"//g' "$MANIFEST"
              fi

              # 2. Key Neutralizer & BuildConfig Force
              sed -i 's/authors = listOf(.*)/authors = listOf("Adam Knight")/' "$PLUGIN_NAME/build.gradle.kts"
              sed -i 's/val properties = Properties().*properties.load(.*)//g' "$PLUGIN_NAME/build.gradle.kts"
              sed -i 's/properties.getProperty(.*)/""/g' "$PLUGIN_NAME/build.gradle.kts"
              
              if ! grep -q "buildConfig = true" "$PLUGIN_NAME/build.gradle.kts"; then
                sed -i 's/buildFeatures {/buildFeatures {\n        buildConfig = true/g' "$PLUGIN_NAME/build.gradle.kts"
              fi

              # 3. Icon Replication
              OLD_ICON_URL=$(grep "iconUrl =" "$PLUGIN_NAME/build.gradle.kts" | sed -E 's/.*iconUrl = ["'\'']([^"'\'']+)["'\''].*/\1/')
              if [ ! -z "$OLD_ICON_URL" ]; then
                curl -L -s -o "$PLUGIN_NAME/icon.png" "$OLD_ICON_URL" || echo "Icon fail"
              fi
              sed -i "s|iconUrl = \".*\"|iconUrl = \"https://raw.githubusercontent.com/admknight/CloudstreamExtensions/master/$PLUGIN_NAME/icon.png\"|" "$PLUGIN_NAME/build.gradle.kts"

            done
          done

          # Clean up
          rm -rf temp_sources

          # Commit and Push
          git add .
          git commit -m "Auto-sync plugins with Mega-Repo surgery logic" || echo "No changes"
          git push origin master
