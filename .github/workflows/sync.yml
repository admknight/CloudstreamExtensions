name: Sync Plugins

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync & Surgical Repair
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          SOURCES=(
            "https://github.com/Hexated/CloudStream-Extensions.git"
            "https://github.com/phisher98/cloudstream-extensions-phisher.git"
            "https://github.com/rockhero1234/cinephile.git"
            "https://github.com/SaurabhKaperwan/CSX.git"
            "https://github.com/Sushan64/NetMirror-Extension.git"
            "https://github.com/Stormunblessed/storm-ext.git"
          )

          ANIME_REGEX="Anichi|AllWish|AnimePahe|Animeav1|AnimeCloud|AnimeDekho|Animedubhindi|Animekhor|Animexin|Gogo|NineAnime|Crunchyroll|Tokusatsu|TokuZilla|Animekisa|Kawaiifu|Aniflix|DubbedAnime|AsiaFlix|KimCartoon|Topcartoon|Toon|OnePace|Donghua|DoraBash|Latanime|Tenshi|Wco|Zoro"
          HINDI_REGEX="Netmirror|Cinevood|Mp4Moviez|Tamil|Skymovies|Bolly|Vega|Moviesmod|CineStream|AllMovieLand|Hindmovie|HDhub4u|FourKHDHub|MovieBlast|Fivemovierulz|Movierulzhd|Cinefreak|Bangla|OnlineMoviesHindi|MoviesDrive|Desicinemas|UHDmovies"
          TOOLS_REGEX="Ultima|Stremio|Jellyfin|BingedReview|RingZ|GDIndex"
          LIVE_REGEX="IPTV|QuickIPTV|Sports|EjaTv|Tvtwofourseven"

          # WIPE OLD MESSY DATA TO START FRESH
          rm -rf Anime Bollywood International LiveTV Tools
          mkdir -p temp_sources

          for REPO_URL in "${SOURCES[@]}"; do
            REPO_NAME=$(echo "$REPO_URL" | sed -E 's|https://[^/]+/([^/]+)/([^/]+)(\.git)?|\1_\2|' | sed 's|\.git||')
            git clone --depth 1 "$REPO_URL" "temp_sources/$REPO_NAME"
            
            # CRITICAL FIX: Only find folders that contain a 'src' directory
            find "temp_sources/$REPO_NAME" -maxdepth 3 -name "src" -type d | while read -r SRC_PATH; do
              PLUGIN_DIR=$(dirname "$SRC_PATH")
              if [ ! -f "$PLUGIN_DIR/build.gradle.kts" ]; then continue; fi
              
              PLUGIN_NAME=$(basename "$PLUGIN_DIR")
              if [[ "$PLUGIN_NAME" =~ ^(gradle|buildSrc|build|.github|.idea)$ ]]; then continue; fi

              CATEGORY="International"
              if [[ "$PLUGIN_NAME" =~ $ANIME_REGEX ]]; then CATEGORY="Anime"; fi
              if [[ "$PLUGIN_NAME" =~ $HINDI_REGEX ]]; then CATEGORY="Bollywood"; fi
              if [[ "$PLUGIN_NAME" =~ $TOOLS_REGEX ]]; then CATEGORY="Tools"; fi
              if [[ "$PLUGIN_NAME" =~ $LIVE_REGEX ]]; then CATEGORY="LiveTV"; fi

              TARGET_DIR="$CATEGORY/$PLUGIN_NAME"
              mkdir -p "$TARGET_DIR"
              cp -r "$PLUGIN_DIR"/* "$TARGET_DIR/"
              
              # --- SURGERY & REPAIR ---
              find "$TARGET_DIR" -name "*.kt" -exec sed -i 's/\.apmap/.map/g' {} +
              find "$TARGET_DIR" -name "*.kt" -exec sed -i 's/MovieSearchResponse(/newMovieSearchResponse(/g' {} +
              find "$TARGET_DIR" -name "*.kt" -exec sed -i 's/TvSeriesSearchResponse(/newTvSeriesSearchResponse(/g' {} +
              find "$TARGET_DIR" -name "*.kt" -exec sed -i 's/AnimeSearchResponse(/newAnimeSearchResponse(/g' {} +

              # Safe buildConfigField Cleanup: Target lines and force value to ""
              sed -i 's/authors = listOf(.*)/authors = listOf("Adam Knight")/' "$TARGET_DIR/build.gradle.kts"
              sed -i -E 's/buildConfigField\("String",\s*"[^"]+",\s*.*\)/buildConfigField("String", "REMOVED", "\\"\\"")/g' "$TARGET_DIR/build.gradle.kts"
              sed -i '/val properties = Properties()/d' "$TARGET_DIR/build.gradle.kts"
              sed -i '/properties.load(/d' "$TARGET_DIR/build.gradle.kts"

              if ! grep -q "buildConfig = true" "$TARGET_DIR/build.gradle.kts"; then
                sed -i 's/buildFeatures {/buildFeatures {\n        buildConfig = true/g' "$TARGET_DIR/build.gradle.kts"
              fi
            done
          done

          rm -rf temp_sources
          git add .
          git commit -m "FRESH RESET: Clean categorized plugins and surgical repair" || echo "No changes"
          git push origin master --force
