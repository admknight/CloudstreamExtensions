name: Sync Plugins

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from Sources
        run: |
          # Configure Git
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          # Sources to sync from (ordered by priority if versions match)
          SOURCES=(
            "https://github.com/Hexated/CloudStream-Extensions.git"
            "https://github.com/phisher98/cloudstream-extensions-phisher.git"
            "https://github.com/Rowdy-Avocado/CloudStream-Extensions.git"
            "https://github.com/rockhero1234/cinephile.git"
            "https://github.com/MegixS/Megix-Repo.git"
            "https://github.com/Stormun/CloudStream-Extensions.git"
          )

          mkdir -p temp_sources

          for REPO_URL in "${SOURCES[@]}"; do
            REPO_NAME=$(basename "$REPO_URL" .git)
            echo "Cloning $REPO_NAME..."
            git clone "$REPO_URL" "temp_sources/$REPO_NAME"
            
            find "temp_sources/$REPO_NAME" -maxdepth 2 -name "build.gradle.kts" | while read -r GRADLE_FILE; do
              PLUGIN_DIR=$(dirname "$GRADLE_FILE")
              PLUGIN_NAME=$(basename "$PLUGIN_DIR")
              
              if [ "$PLUGIN_DIR" == "temp_sources/$REPO_NAME" ]; then continue; fi
              if [[ "$PLUGIN_NAME" =~ ^(gradle|buildSrc|build|.github|.idea)$ ]]; then continue; fi

              # --- SMART VERSION CONTROL ---
              NEW_VERSION=$(grep -E "^version\s*=" "$GRADLE_FILE" | sed -E 's/.*=[[:space:]]*"?([0-9]+)"?.*/\1/')
              OLD_VERSION=$(grep -E "^version\s*=" "$PLUGIN_NAME/build.gradle.kts" 2>/dev/null | sed -E 's/.*=[[:space:]]*"?([0-9]+)"?.*/\1/')
              
              if [ ! -z "$NEW_VERSION" ] && [ ! -z "$OLD_VERSION" ] && [ "$NEW_VERSION" -le "$OLD_VERSION" ]; then
                echo "Skipping $PLUGIN_NAME from $REPO_NAME (Local version $OLD_VERSION >= Source version $NEW_VERSION)"
                continue
              fi

              echo "Updating $PLUGIN_NAME from $REPO_NAME (v$OLD_VERSION -> v$NEW_VERSION)..."
              mkdir -p "$PLUGIN_NAME"
              cp -r "$PLUGIN_DIR"/* "$PLUGIN_NAME/"
              
              # --- BRANDING & INDEPENDENCE ---
              sed -i 's/authors = listOf(.*)/authors = listOf("Adam Knight")/' "$PLUGIN_NAME/build.gradle.kts"
              
              OLD_ICON_URL=$(grep "iconUrl =" "$PLUGIN_NAME/build.gradle.kts" | sed -E 's/.*iconUrl = ["'\'']([^"'\'']+)["'\''].*/\1/')
              if [ ! -z "$OLD_ICON_URL" ]; then
                curl -L -s -o "$PLUGIN_NAME/icon.png" "$OLD_ICON_URL" || echo "Failed to download icon for $PLUGIN_NAME"
              fi
              
              sed -i "s|iconUrl = \".*\"|iconUrl = \"https://raw.githubusercontent.com/admknight/CloudstreamExtensions/master/$PLUGIN_NAME/icon.png\"|" "$PLUGIN_NAME/build.gradle.kts"
              sed -i "s|iconUrl = '.*'|iconUrl = \"https://raw.githubusercontent.com/admknight/CloudstreamExtensions/master/$PLUGIN_NAME/icon.png\"|" "$PLUGIN_NAME/build.gradle.kts"
            done
          done

          # Clean up
          rm -rf temp_sources

          # Commit and Push
          git add .
          git commit -m "Auto-sync plugins, download icons, and apply Adam Knight branding" || echo "No changes to commit"
          git push
