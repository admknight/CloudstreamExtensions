name: Publish Stable Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.1.0"
        required: true
        default: "v1.1.0"
        type: string
      title:
        description: "Release title (leave blank to use the tag)"
        required: false
        default: ""
        type: string
      confirm:
        description: "I reviewed the generated production notes and want to publish this stable release"
        required: true
        default: false
        type: boolean

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Require explicit approval
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "true" ]; then
            echo "Stable release was not explicitly approved."
            exit 1
          fi

      - name: Checkout master
        uses: actions/checkout@v5
        with:
          path: source

      - name: Checkout production snapshot
        uses: actions/checkout@v5
        with:
          ref: builds
          path: builds

      - name: Validate generated release notes
        run: |
          set -euo pipefail
          test -s builds/RELEASE_NOTES.md
          test -s builds/release-diff.json
          test -s builds/repo.json
          test -s builds/plugins.json
          test -s builds/merge-report.json
          test -s builds/provenance.json
          cat builds/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        working-directory: source
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; leaving it unchanged."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish stable release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        working-directory: source
        run: |
          set -euo pipefail
          release_title="$TITLE"
          if [ -z "$release_title" ]; then
            release_title="Adam Knight Mega Repo $TAG"
          fi

          gh release create "$TAG" \
            --target master \
            --title "$release_title" \
            --notes-file ../builds/RELEASE_NOTES.md \
            --latest \
            ../builds/repo.json \
            ../builds/plugins.json \
            ../builds/merge-report.json \
            ../builds/provenance.json \
            ../builds/release-diff.json \
            ../builds/RELEASE_NOTES.md

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        working-directory: source
        run: |
          gh release view "$TAG" --json tagName,name,url,isDraft,isPrerelease,publishedAt,assets
