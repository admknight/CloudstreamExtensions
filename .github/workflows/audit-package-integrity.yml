name: Audit Published Plugin Integrity

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/audit_package_integrity.py'
      - 'tools/guarded_audit_classification.py'
      - 'tests/test_audit_package_integrity.py'
      - 'tests/test_guarded_audit_classification.py'
      - '.github/workflows/audit-package-integrity.yml'
  pull_request:
    paths:
      - 'tools/audit_package_integrity.py'
      - 'tools/guarded_audit_classification.py'
      - 'tests/test_audit_package_integrity.py'
      - 'tests/test_guarded_audit_classification.py'
      - '.github/workflows/audit-package-integrity.yml'

permissions:
  contents: read

concurrency:
  group: audit-published-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout one consistent published catalog snapshot
        uses: actions/checkout@v4
        with:
          ref: builds
          path: published-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (no network)
        run: |
          python3 -m unittest discover -s tests -p test_audit_package_integrity.py -v
          python3 -m unittest discover -s tests -p test_guarded_audit_classification.py -v
      - name: Verify rotating package hashes and distinguish documented holds from new failures
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 tools/audit_package_integrity.py \
            --published-file published-catalog/plugins.json \
            --provenance-file published-catalog/provenance.json \
            --guarded-release-report published-catalog/merge-report.json \
            --json-report audit-report.json \
            --markdown-report audit-summary.md
      - name: Publish verification summary
        if: always()
        run: |
          if [ -f audit-summary.md ]; then cat audit-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-integrity-audit-${{ github.run_id }}
          path: |
            audit-report.json
            audit-summary.md
          if-no-files-found: warn
          retention-days: 14
