name: Build Local CloudStream Plugins

concurrency:
  group: custom-plugin-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '**/src/**'
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/custom-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          path: source

      - name: Checkout custom builds
        uses: actions/checkout@v5
        with:
          ref: custom-builds
          path: custom-builds

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build local plugins
        run: |
          cd "$GITHUB_WORKSPACE/source"
          gradle make makePluginsJson
          gradle ensureJarCompatibility

      - name: Prepare custom-builds branch
        run: |
          cd "$GITHUB_WORKSPACE/custom-builds"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          find "$GITHUB_WORKSPACE/source" -path '*/build/*.cs3' -type f -exec cp {} . \;
          find "$GITHUB_WORKSPACE/source" -path '*/build/*.jar' -type f -exec cp {} . \;
          cp "$GITHUB_WORKSPACE/source"/build/plugins.json plugins.json
          python3 "$GITHUB_WORKSPACE/source/tools/provider_architecture_audit.py" \
            --root "$GITHUB_WORKSPACE/source" \
            --json "$GITHUB_WORKSPACE/source/provider-architecture.json" \
            --markdown "$GITHUB_WORKSPACE/source/PROVIDER_ARCHITECTURE.md" \
            --filter-plugins plugins.json \
            --filter-artifacts-dir .
          cp "$GITHUB_WORKSPACE/source/PROVIDER_ARCHITECTURE.md" PROVIDER_ARCHITECTURE.md
          cp "$GITHUB_WORKSPACE/source/provider-architecture.json" provider-architecture.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("plugins.json")
          plugins = json.loads(path.read_text())
          for plugin in plugins:
              for key in ("url", "jarUrl"):
                  value = plugin.get(key)
                  if value:
                      plugin[key] = value.replace(
                          "https://raw.githubusercontent.com/admknight/CloudstreamExtensions/builds/",
                          "https://raw.githubusercontent.com/admknight/CloudstreamExtensions/custom-builds/"
                      )
          path.write_text(json.dumps(plugins, indent=2) + "\n")
          PY
          cat > repo.json <<'EOF'
          {
            "name": "Adam Knight Custom Providers",
            "description": "Custom CloudStream providers maintained inside the Adam Knight Mega Repo",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/admknight/CloudstreamExtensions/custom-builds/plugins.json"
            ]
          }
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path

          plugins = json.loads(Path("plugins.json").read_text())
          rows = []
          for i, plugin in enumerate(sorted(plugins, key=lambda p: (p.get("name") or p.get("internalName") or "").lower()), 1):
              name = plugin.get("name") or plugin.get("internalName") or "Unknown"
              version = plugin.get("version", "—")
              language = plugin.get("language") or "—"
              types = ", ".join(plugin.get("tvTypes") or []) or "—"
              description = (plugin.get("description") or "").replace("|", "\\|")
              rows.append(f"| {i} | **{name}** | {version} | {language} | {types} | {description} |")

          count = len(plugins)
          readme = [
              '<p align="center">',
              '  <img src="https://raw.githubusercontent.com/admknight/CloudstreamExtensions/refs/heads/master/assets/icon.png" alt="Adam Knight Custom CloudStream Providers" width="160">',
              '</p>',
              '',
              '<h1 align="center">Adam Knight Custom CloudStream Providers</h1>',
              '',
              '<p align="center">',
              '  <a href="https://github.com/admknight/CloudstreamExtensions/actions/workflows/custom-build.yml">',
              '    <img src="https://github.com/admknight/CloudstreamExtensions/actions/workflows/custom-build.yml/badge.svg?branch=master" alt="Custom Provider Build">',
              '  </a>',
              '  <a href="https://github.com/admknight/CloudstreamExtensions/actions/workflows/health.yml">',
              '    <img src="https://github.com/admknight/CloudstreamExtensions/actions/workflows/health.yml/badge.svg?branch=master" alt="Provider Health">',
              '  </a>',
              f'  <img src="https://img.shields.io/badge/custom%20plugins-{count}-2ea44f?style=flat-square" alt="{count} custom plugins">',
              '  <a href="https://github.com/admknight/CloudstreamExtensions/stargazers">',
              '    <img src="https://img.shields.io/github/stars/admknight/CloudstreamExtensions?style=flat-square" alt="GitHub stars">',
              '  </a>',
              '</p>',
              '',
              'This branch contains the **compiled custom CloudStream extensions** maintained as part of the Adam Knight Mega Repo. '
              'It is generated automatically from source modules on the `master` branch; files here should not be edited manually.',
              '',
              '## Install',
              '',
              '### Full Mega Repo (recommended)',
              '',
              'In CloudStream: **Settings → Extensions → Add Repository** and enter:',
              '',
              '    admknight',
              '',
              '### Custom providers feed only',
              '',
              '    https://raw.githubusercontent.com/admknight/CloudstreamExtensions/custom-builds/repo.json',
              '',
              '## Custom providers',
              '',
              f'**{count} custom CloudStream plugins are currently published on this branch.**',
              '',
              '| # | Provider | Version | Lang | Types | Description |',
              '| ---: | --- | ---: | --- | --- | --- |',
              *rows,
              '',
              '## Automation',
              '',
              '- Source code lives on the `master` branch.',
              '- GitHub Actions compiles all discovered custom provider modules.',
              '- Successful builds publish `.cs3`, `.jar`, `plugins.json`, and this README automatically.',
              '- The custom feed automatically triggers the production Mega Repo aggregation.',
              '- A static architecture audit removes incomplete providers that do not implement the CloudStream playback contract.',
              '- A separate scheduled workflow checks configured provider websites and reports runtime availability.',
              '',
              '## Branch files',
              '',
              '- `repo.json` — CloudStream repository manifest.',
              '- `plugins.json` — generated custom plugin catalog.',
              '- `*.cs3` — installable CloudStream plugin packages.',
              '- `*.jar` — generated plugin JARs.',
              '- `PROVIDER_ARCHITECTURE.md` — source-level CloudStream provider contract audit.',
              '- `provider-architecture.json` — machine-readable architecture audit.',
              '',
              '## Disclaimer',
              '',
              'This project is an extension index/build project and does not host video or media content. '
              'Package availability and website health checks do not guarantee that every third-party provider feature will work at runtime.',
              '',
              '*Maintained by Adam Knight*',
              '',
          ]
          Path("README.md").write_text("\n".join(readme))
          PY

      - name: Publish custom builds
        run: |
          cd "$GITHUB_WORKSPACE/custom-builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if git diff --cached --quiet; then
            echo "No custom plugin changes to publish."
          else
            git commit -m "Custom plugin build: ${GITHUB_SHA::8}"
            for attempt in 1 2 3; do
              if git push origin HEAD:custom-builds; then
                echo "CUSTOM_PUBLISHED=true" >> "$GITHUB_ENV"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to push custom-builds after 3 attempts."
                exit 1
              fi
              echo "Custom-build push failed (attempt $attempt/3); retrying..."
              sleep $((attempt * 10))
            done
          fi

      - name: Trigger production aggregation
        if: env.CUSTOM_PUBLISHED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE/source"
          for attempt in 1 2 3; do
            if gh workflow run build.yml --ref master; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to trigger production aggregation after 3 attempts."
              exit 1
            fi
            echo "Aggregation trigger failed (attempt $attempt/3); retrying..."
            sleep $((attempt * 10))
          done
