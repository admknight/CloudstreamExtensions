name: Build Local CloudStream Plugins

concurrency:
  group: custom-plugin-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '**/src/**'
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/custom-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          path: source

      - name: Checkout custom builds
        uses: actions/checkout@v5
        with:
          ref: custom-builds
          path: custom-builds

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build local plugins
        run: |
          cd "$GITHUB_WORKSPACE/source"
          gradle make makePluginsJson
          gradle ensureJarCompatibility

      - name: Prepare custom-builds branch
        run: |
          cd "$GITHUB_WORKSPACE/custom-builds"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          find "$GITHUB_WORKSPACE/source" -path '*/build/*.cs3' -type f -exec cp {} . \;
          find "$GITHUB_WORKSPACE/source" -path '*/build/*.jar' -type f -exec cp {} . \;
          cp "$GITHUB_WORKSPACE/source"/build/plugins.json plugins.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("plugins.json")
          plugins = json.loads(path.read_text())
          for plugin in plugins:
              for key in ("url", "jarUrl"):
                  value = plugin.get(key)
                  if value:
                      plugin[key] = value.replace(
                          "https://raw.githubusercontent.com/admknight/CloudstreamExtensions/builds/",
                          "https://raw.githubusercontent.com/admknight/CloudstreamExtensions/custom-builds/"
                      )
          path.write_text(json.dumps(plugins, indent=2) + "\n")
          PY
          cat > repo.json <<'EOF'
          {
            "name": "Adam Knight Custom Providers",
            "description": "Custom CloudStream providers maintained inside the Adam Knight Mega Repo",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/admknight/CloudstreamExtensions/custom-builds/plugins.json"
            ]
          }
          EOF

      - name: Publish custom builds
        run: |
          cd "$GITHUB_WORKSPACE/custom-builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if git diff --cached --quiet; then
            echo "No custom plugin changes to publish."
          else
            git commit -m "Custom plugin build: ${GITHUB_SHA::8}"
            git push origin HEAD:custom-builds
            echo "CUSTOM_PUBLISHED=true" >> "$GITHUB_ENV"
          fi

      - name: Trigger production aggregation
        if: env.CUSTOM_PUBLISHED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE/source"
          gh workflow run build.yml --ref master
