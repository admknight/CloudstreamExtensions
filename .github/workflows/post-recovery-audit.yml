name: Verify production after guarded recovery

on:
  workflow_run:
    workflows: ["Update Aggregated Repository"]
    types: [completed]
    branches: [master]

permissions:
  actions: write
  contents: read

concurrency:
  group: verify-after-guarded-dispatch
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger complete published catalog integrity audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run audit-package-integrity.yml --ref master -f full=true
          echo "A full independent integrity audit has been dispatched."
